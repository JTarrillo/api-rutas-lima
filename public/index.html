<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Rutas Lima - Optimización de Rutas Médicas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #map {
            height: 500px;
            border-radius: 8px;
        }

        .routes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .route-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .route-card:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .route-card.optimal {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .route-card.selected {
            background: #cce5ff;
            border-left-color: #0056b3;
            border-left-width: 6px;
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        .route-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .route-title {
            font-weight: bold;
            color: #333;
        }

        .route-time {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .route-steps {
            font-size: 0.9em;
            color: #666;
        }

        .step {
            margin: 5px 0;
            padding-left: 15px;
            position: relative;
        }

        .step::before {
            content: "→";
            position: absolute;
            left: 0;
            color: #667eea;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #5568d3;
        }

        #nodeSearch {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        #nodeSearch:focus {
            outline: none;
            border-color: #764ba2;
        }

        .legend {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .ambulance-marker {
            font-size: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: pulse 1s ease-in-out infinite;
            line-height: 1;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .progress-popup .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 10px;
        }

        .progress-popup .leaflet-popup-tip {
            background: #764ba2;
        }

        .popup-content {
            font-size: 14px;
            line-height: 1.6;
            min-width: 200px;
        }

        .popup-content.success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚑 Optimización de Rutas Médicas - Lima</h1>
        
        <div class="content">
            <div class="panel">
                <div class="controls">
                    <input type="text" id="nodeSearch" placeholder="Buscar ubicación o nodo..." oninput="searchNode()">
                    <button onclick="loadAllRoutes()">Cargar Todas las Rutas</button>
                    <button onclick="findOptimalRoute()">Ruta Óptima</button>
                    <button onclick="clearMap()">Limpiar Mapa</button>
                </div>
                <div id="map"></div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #28a745;"></div>
                        <span>Ruta Óptima (más rápida)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #667eea;"></div>
                        <span>Rutas Alternativas</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #dc3545;"></div>
                        <span>Puntos de Interés (nodos)</span>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>Rutas Disponibles</h2>
                <div class="routes-list" id="routesList">
                    <p style="color: #666; text-align: center; margin-top: 20px;">
                        Haz clic en "Cargar Todas las Rutas" para ver las opciones
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let routeLayers = [];
        let nodeMarkers = [];
        let nodesData = {};
        let loadedRoutes = [];

        // Inicializar mapa
        function initMap() {
            map = L.map('map').setView([-12.0856, -77.0305], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
        }

        // Cargar todos los nodos
        async function loadNodes() {
            const response = await fetch('/api/nodes');
            const nodes = await response.json();
            nodesData = nodes;

            for (const [id, node] of Object.entries(nodes)) {
                const marker = L.marker([node.lat, node.lng])
                    .addTo(map)
                    .bindPopup(`<b>${id}</b>: ${node.name}`);
                nodeMarkers.push(marker);
            }
        }

        // Buscar nodo por nombre o ID
        function searchNode() {
            const searchTerm = document.getElementById('nodeSearch').value.trim().toLowerCase();

            if (searchTerm === '') {
                // Restaurar vista general si el campo está vacío
                if (nodeMarkers.length > 0) {
                    const bounds = L.latLngBounds([]);
                    nodeMarkers.forEach(marker => {
                        bounds.extend(marker.getLatLng());
                    });
                    map.fitBounds(bounds, { padding: [60, 60] });
                }
                return;
            }

            // Buscar coincidencia por ID o nombre
            for (const [id, node] of Object.entries(nodesData)) {
                if (id.toLowerCase() === searchTerm || node.name.toLowerCase().includes(searchTerm)) {
                    // Centrar y hacer zoom en el nodo encontrado
                    map.setView([node.lat, node.lng], 16);

                    // Encontrar y abrir el popup del marcador correspondiente
                    const marker = nodeMarkers.find(m => {
                        const latLng = m.getLatLng();
                        return latLng.lat === node.lat && latLng.lng === node.lng;
                    });

                    if (marker) {
                        marker.openPopup();
                    }
                    break;
                }
            }
        }

        // Cargar todas las rutas
        async function loadAllRoutes() {
            clearMap();
            await loadNodes();

            const response = await fetch('/api/all-routes');
            const routes = await response.json();
            loadedRoutes = routes;

            displayRoutes(routes);

            // NO dibujar todas las líneas, solo mostrar nodos
            // Ajustar bounds para mostrar todos los nodos
            if (nodeMarkers.length > 0) {
                const bounds = L.latLngBounds([]);
                nodeMarkers.forEach(marker => {
                    bounds.extend(marker.getLatLng());
                });
                map.fitBounds(bounds, { padding: [60, 60] });
            }
        }

        // Encontrar ruta óptima
        async function findOptimalRoute() {
            clearMap();
            await loadNodes();

            const response = await fetch('/api/route/A/F');
            const route = await response.json();

            if (route) {
                // Extraer las coordenadas de los pasos de la ruta óptima
                const coordinates = route.steps.map(step => [step.lat, step.lng]);

                // Crear los límites combinando la ruta y todos los marcadores de nodos
                const bounds = L.latLngBounds(coordinates);
                
                nodeMarkers.forEach(marker => {
                    bounds.extend(marker.getLatLng());
                });

                // Ajustar el zoom y la posición del mapa con un margen cómodo
                map.fitBounds(bounds, { padding: [80, 80] });

                displayOptimalRoute(route);

                // Dibujar la polilínea antes de animar
                const polyline = L.polyline(coordinates, {
                    color: '#28a745',
                    weight: 6,
                    opacity: 0.8
                }).addTo(map);

                routeLayers.push(polyline);

                animateRoute(coordinates, route, '#28a745');
            }
        }

        // Animar la ruta paso a paso
        function animateRoute(coordinates, route, color = '#28a745') {
            // Crear marcador de la ambulancia
            const ambulanceIcon = L.divIcon({
                html: '🚑',
                className: 'ambulance-marker',
                iconSize: [50, 50],
                iconAnchor: [25, 25]
            });

            const ambulanceMarker = L.marker(coordinates[0], {
                icon: ambulanceIcon,
                zIndexOffset: 1000 // Asegurar que esté por encima de todo
            }).addTo(map);

            routeLayers.push(ambulanceMarker);

            // Encontrar y ocultar temporalmente la línea estática si existe
            let staticPolyline = null;
            if (routeLayers.length > 1) {
                staticPolyline = routeLayers[routeLayers.length - 2];
                if (staticPolyline && staticPolyline.getBounds) {
                    staticPolyline.setStyle({ opacity: 0 });
                }
            }

            // Dibujar línea progresiva (vacía al inicio)
            const routePolyline = L.polyline([], {
                color: color,
                weight: 6,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(map);

            routeLayers.push(routePolyline);

            // Resaltar el paso inicial (punto de partida)
            updateStepHighlight(0, route, color);

            // Animar el carrito a lo largo de la línea
            let currentSegment = 0;
            let progress = 0;
            const segmentsPerSecond = 0.4; // Velocidad de movimiento (más lento)
            const animationInterval = 50; // Actualizar cada 50ms

            function animate() {
                if (currentSegment < coordinates.length - 1) {
                    progress += segmentsPerSecond * (animationInterval / 1000);

                    if (progress >= 1) {
                        progress = 0;
                        currentSegment++;
                        // Actualizar el resaltado del paso actual con el color de la ruta
                        updateStepHighlight(currentSegment, route, color);
                    }

                    if (currentSegment < coordinates.length - 1) {
                        // Interpolar posición entre puntos
                        const start = coordinates[currentSegment];
                        const end = coordinates[currentSegment + 1];

                        const lat = start[0] + (end[0] - start[0]) * progress;
                        const lng = start[1] + (end[1] - start[1]) * progress;

                        ambulanceMarker.setLatLng([lat, lng]);

                        // Dibujar línea hasta la posición actual
                        const pathUpToCurrent = coordinates.slice(0, currentSegment + 1);
                        pathUpToCurrent.push([lat, lng]);

                        routePolyline.setLatLngs(pathUpToCurrent);

                        setTimeout(animate, animationInterval);
                    } else {
                        // Animación completada
                        ambulanceMarker.setLatLng(coordinates[coordinates.length - 1]);
                        routePolyline.setLatLngs(coordinates);
                        routePolyline.setStyle({ dashArray: null });

                        // Mostrar nuevamente la línea estática y remover la línea progresiva
                        if (staticPolyline) {
                            staticPolyline.setStyle({ opacity: 0.8 });
                        }
                        map.removeLayer(routePolyline);

                        // Remover la línea progresiva del array
                        const index = routeLayers.indexOf(routePolyline);
                        if (index > -1) {
                            routeLayers.splice(index, 1);
                        }
                    }
                }
            }

            animate();
        }

        // Actualizar resaltado del paso actual
        function updateStepHighlight(currentIndex, route, color = '#28a745') {
            const container = document.getElementById('routesList');
            const steps = container.querySelectorAll('.step');

            steps.forEach((step, index) => {
                if (index === currentIndex) {
                    step.style.background = color;
                    step.style.color = 'white';
                    step.style.padding = '5px 10px';
                    step.style.borderRadius = '5px';
                    step.style.fontWeight = 'bold';
                } else {
                    step.style.background = '';
                    step.style.color = '';
                    step.style.padding = '';
                    step.style.borderRadius = '';
                    step.style.fontWeight = '';
                }
            });
        }

        // Mostrar rutas en el panel
        function displayRoutes(routes) {
            const container = document.getElementById('routesList');
            container.innerHTML = '';

            routes.forEach((route, index) => {
                const isOptimal = index === 0;
                const card = document.createElement('div');
                card.className = `route-card ${isOptimal ? 'optimal' : ''}`;
                card.dataset.index = index;
                card.onclick = () => selectRoute(index);

                // Calcular tiempos acumulados
                let cumulativeTime = 0;
                const stepsHtml = route.coordinates.map((coord, i) => {
                    if (i === 0) {
                        return `<div class="step" data-index="${i}">🚑 Inicio: ${coord.name}</div>`;
                    } else {
                        // Sumar el tiempo del tramo anterior
                        if (route.steps[i - 1]) {
                            cumulativeTime += route.steps[i - 1].time;
                        }
                        return `<div class="step" data-index="${i}">📍 ${coord.name} (Tiempo acumulado: ${cumulativeTime} min)</div>`;
                    }
                }).join('');

                card.innerHTML = `
                    <div class="route-header">
                        <span class="route-title">${isOptimal ? '⭐ Ruta Óptima' : `Ruta ${index + 1}`}</span>
                        <span class="route-time">${route.totalTime} min</span>
                    </div>
                    <div class="route-steps">
                        ${stepsHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Seleccionar ruta
        function selectRoute(index) {
            // Remover clase selected de todas las tarjetas
            const allCards = document.querySelectorAll('.route-card');
            allCards.forEach(card => card.classList.remove('selected'));

            // Agregar clase selected a la tarjeta seleccionada
            const selectedCard = document.querySelector(`.route-card[data-index="${index}"]`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }

            // Limpiar los estilos de todos los pasos antes de la nueva animación
            const allSteps = document.querySelectorAll('.step');
            allSteps.forEach(step => {
                step.style.background = '';
                step.style.color = '';
                step.style.padding = '';
                step.style.borderRadius = '';
                step.style.fontWeight = '';
            });

            // Llamar a highlightRoute para dibujar y animar solo la ruta seleccionada
            highlightRoute(index);
        }

        // Mostrar ruta óptima
        function displayOptimalRoute(route) {
            const container = document.getElementById('routesList');
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'route-card optimal';

            const stepsHtml = route.steps.map((step, i) => {
                if (i === 0) return `<div class="step" data-index="${i}">🚑 Inicio: ${step.name}</div>`;
                return `<div class="step" data-index="${i}">📍 ${step.name} (Tiempo acumulado: ${step.cumulativeTime} min)</div>`;
            }).join('');

            card.innerHTML = `
                <div class="route-header">
                    <span class="route-title">⭐ Ruta Óptima - Animación en progreso</span>
                    <span class="route-time">${route.totalDistance} min</span>
                </div>
                <div class="route-steps">
                    ${stepsHtml}
                </div>
            `;

            container.appendChild(card);
        }

        // Dibujar rutas en el mapa
        function drawRoutes(routes, markers) {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c'];

            routes.forEach((route, index) => {
                const coordinates = route.coordinates.map(coord => [coord.lat, coord.lng]);
                const polyline = L.polyline(coordinates, {
                    color: colors[index % colors.length],
                    weight: 4,
                    opacity: 0.7
                }).addTo(map);

                routeLayers.push(polyline);
            });

            // Calcular bounds incluyendo todas las rutas y los marcadores de nodos
            if (routeLayers.length > 0 || markers.length > 0) {
                const bounds = L.latLngBounds([]);

                // Incluir bounds de todas las rutas
                routeLayers.forEach(layer => {
                    if (layer.getBounds) {
                        bounds.extend(layer.getBounds());
                    }
                });

                // Incluir bounds de todos los marcadores de nodos
                markers.forEach(marker => {
                    bounds.extend(marker.getLatLng());
                });

                map.fitBounds(bounds, { padding: [60, 60] });
            }
        }

        // Resaltar ruta específica
        function highlightRoute(index) {
            // Limpiar todas las capas de rutas anteriores (líneas y animaciones)
            routeLayers.forEach(layer => map.removeLayer(layer));
            routeLayers = [];

            // Dibujar solo la ruta seleccionada
            if (loadedRoutes.length > 0 && loadedRoutes[index]) {
                const selectedRoute = loadedRoutes[index];
                const coordinates = selectedRoute.coordinates.map(coord => [coord.lat, coord.lng]);
                const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c'];
                const color = colors[index % colors.length];

                // Dibujar la polilínea de la ruta seleccionada
                const polyline = L.polyline(coordinates, {
                    color: color,
                    weight: 6,
                    opacity: 0.8
                }).addTo(map);

                routeLayers.push(polyline);

                // Ajustar zoom para incluir la ruta seleccionada y todos los nodos
                const bounds = L.latLngBounds(coordinates);
                nodeMarkers.forEach(marker => {
                    bounds.extend(marker.getLatLng());
                });
                map.fitBounds(bounds, { padding: [60, 60] });

                // Animar la ruta seleccionada con la ambulancia
                animateRoute(coordinates, selectedRoute, color);
            }
        }

        // Limpiar mapa
        function clearMap() {
            routeLayers.forEach(layer => map.removeLayer(layer));
            nodeMarkers.forEach(marker => map.removeLayer(marker));
            routeLayers = [];
            nodeMarkers = [];
        }

        // Inicializar
        initMap();
    </script>
</body>
</html>
